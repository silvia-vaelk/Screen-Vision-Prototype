<!doctype html>
<html><head><meta charset="utf-8"><title>Redesign icons preview</title>
<style>
  body{background:#1b1b1e;color:#fff;font-family:Inter,system-ui,sans-serif;margin:0;padding:32px}
  h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#9a98a0;margin:28px 0 12px}
  .grid{display:flex;flex-wrap:wrap;gap:14px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:14px 8px;background:#262629;border-radius:12px}
  .cell img{width:26px;height:26px;filter:invert(1)} /* stroke icons use currentColor≈black → invert to white */
  .cell.purple{background:#7b59ff}
  .cell .lbl{font-size:11px;color:#bcbec4;text-align:center;word-break:break-word}
  .swatches{display:flex;gap:10px;align-items:center}
  .sw{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
  .sw.sel{box-shadow:0 0 0 2px #1b1b1e,0 0 0 4px rgba(255,255,255,.85)}
  .barmock{display:inline-flex;align-items:center;gap:4px;background:#1b1b1e;border:1px solid #333;padding:6px;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  .tool{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .tool img{width:24px;height:24px;filter:invert(1)}
  .tool.active{background:#7b59ff}
  .div{width:1px;height:22px;background:rgba(255,255,255,.14);margin:0 6px}
</style></head>
<body>
  <h2>Bottom nav — assembled mock</h2>
  <div class="barmock">
    <div class="tool active"><img src="icons/select.svg"></div>
    <div class="tool"><img src="icons/pen.svg"></div>
    <div class="tool"><img src="icons/comment.svg"></div>
    <div class="tool"><img src="icons/camera.svg"></div>
    <div class="div"></div>
    <div class="tool"><img src="icons/undo.svg"></div>
    <div class="tool"><img src="icons/redo.svg"></div>
  </div>

  <h2>Color swatch row (Pen / Comment options)</h2>
  <div class="swatches">
    <div class="sw sel" style="background:#2a2a2e">✓</div>
    <div class="sw" style="background:#ee6b5e"></div>
    <div class="sw" style="background:#f6a831"></div>
    <div class="sw" style="background:#67c98a"></div>
    <div class="sw" style="background:#8470f0"></div>
  </div>

  <h2>All reconstructed icons</h2>
  <div class="grid" id="grid"></div>

  <script>
    const icons=["select","pen","comment","camera","undo","redo","chevron-down",
      "laser-pointer","callout","section-tool",
      "cam-grid","cam-crop","toggle-layers","toggle-scene",
      "lock","lock-open","eye","eye-off","search","plus","expand","collapse-left","chevron-right"];
    const g=document.getElementById('grid');
    icons.forEach(n=>{g.insertAdjacentHTML('beforeend',
      `<div class="cell"><img src="icons/${n}.svg"><div class="lbl">${n}</div></div>`);});
  </script>
</body></html>
